<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Your Calls — Jolly Phone</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   JOLLY PHONE — CLIENT DASHBOARD v3 (sidebar)
   ============================================================ */
:root{
  --bg:#0a0908;
  --panel:#141110;
  --panel-2:#1a1614;
  --panel-3:#221c18;
  --line:rgba(255,255,255,.075);
  --line-copper:rgba(245,130,43,.18);

  --copper:#f5822b;
  --copper-lite:#ffb066;
  --copper-deep:#b5541a;

  --text:#f6f1ea;
  --soft:#c9beb2;
  --muted:#93897d;
  --dim:#645b51;

  --urgent:#ff4d42;
  --urgent-soft:rgba(255,77,66,.10);
  --ok:#63cf9e;

  --display:'Oxanium',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --r:18px;
  --side:250px;
  --side-mini:70px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--copper-lite);outline-offset:2px;border-radius:6px}
::selection{background:var(--copper);color:#150c04}
*::-webkit-scrollbar{width:10px}
*::-webkit-scrollbar-thumb{background:#2a231e;border-radius:99px;border:3px solid var(--bg)}

#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:999}
#boot img{height:44px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}

/* ---------------- sign in ---------------- */
#auth{position:fixed;inset:0;display:none;place-items:center;padding:24px;z-index:900;background:var(--bg)}
#auth.show{display:grid}
.auth-card{position:relative;width:100%;max-width:390px}
.auth-card img{display:block;height:52px;margin:0 auto 16px}
.auth-brand{font-family:var(--display);font-weight:800;font-size:25px;text-align:center;letter-spacing:.02em;
  background:linear-gradient(180deg,#ffd9b3,var(--copper) 55%,var(--copper-deep));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.auth-sub{text-align:center;color:var(--dim);font-size:13.5px;margin:8px 0 28px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:7px}
.field input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;transition:border-color .18s,box-shadow .18s}
.field input:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 3px rgba(245,130,43,.18)}
.btn-primary{width:100%;padding:14px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.03em;
  color:#180d04;background:linear-gradient(180deg,var(--copper-lite),var(--copper));transition:filter .18s,transform .12s}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn-primary:active:not(:disabled){transform:translateY(1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.auth-alt{display:block;width:100%;text-align:center;margin-top:16px;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.auth-alt:hover{color:var(--copper-lite)}
.auth-msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13.5px;display:none;line-height:1.5}
.auth-msg.show{display:block}
.auth-msg.err{background:var(--urgent-soft);border:1px solid rgba(255,77,66,.3);color:#ff9089}
.auth-msg.ok{background:rgba(99,207,158,.09);border:1px solid rgba(99,207,158,.28);color:var(--ok)}

/* ---------------- frame ---------------- */
#app{display:none;min-height:100vh}
#app.show{display:flex}

/* ---------------- sidebar ---------------- */
#side{flex:0 0 var(--side);width:var(--side);position:sticky;top:0;height:100vh;height:100dvh;
  display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);
  transition:flex-basis .24s cubic-bezier(.22,.9,.3,1),width .24s cubic-bezier(.22,.9,.3,1);overflow:hidden;z-index:80}
.side-top{display:flex;align-items:center;gap:11px;padding:18px 16px 14px;min-height:66px}
.side-top img{height:32px;flex:none}
.side-biz{min-width:0;flex:1}
.side-biz h1{font-family:var(--display);font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-biz .sub{display:flex;align-items:center;gap:7px;margin-top:2px;font-size:11.5px;color:var(--dim);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.live{background:var(--ok);animation:pulse 2.2s ease-out infinite}
.dot.wait{background:#e9a13b;animation:blink 1s steps(2) infinite}
.dot.off{background:var(--urgent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(99,207,158,.5)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes blink{50%{opacity:.25}}

.side-nav{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px 12px;border-radius:12px;
  color:var(--muted);font-family:var(--display);font-weight:600;font-size:14.5px;letter-spacing:.02em;
  transition:background .16s,color .16s;text-align:left;white-space:nowrap}
.item:hover{background:var(--panel-2);color:var(--soft)}
.item.active{background:linear-gradient(90deg,rgba(245,130,43,.14),rgba(245,130,43,.05));color:var(--text)}
.item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,var(--copper-lite),var(--copper))}
.item svg{width:20px;height:20px;flex:none;stroke-width:1.9}
.item.active svg{color:var(--copper-lite)}
.item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .n{flex:none;min-width:21px;padding:1px 7px;border-radius:99px;font-size:11.5px;font-weight:700;text-align:center;
  color:#180d04;background:linear-gradient(180deg,var(--copper-lite),var(--copper))}
.item .n:empty{display:none}

.side-foot{padding:10px 12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.f-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:11px;color:var(--muted);
  font-size:13.5px;font-weight:500;transition:background .16s,color .16s;text-align:left;white-space:nowrap}
.f-item:hover{background:var(--panel-2);color:var(--text)}
.f-item.on{color:var(--copper)}
.f-item svg{width:18px;height:18px;flex:none;stroke-width:1.9}
.f-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}

#collapse{margin:4px 12px 12px;align-self:flex-start}
#collapse svg{transition:transform .24s}

/* collapsed */
#app.mini #side{flex-basis:var(--side-mini);width:var(--side-mini)}
#app.mini .side-biz,#app.mini .item .lbl,#app.mini .f-item .lbl{display:none}
#app.mini .side-top{justify-content:center;padding-inline:0}
#app.mini .item,#app.mini .f-item{justify-content:center;padding-inline:0}
#app.mini .item .n{position:absolute;top:5px;right:8px;min-width:17px;padding:0 5px;font-size:10px}
#app.mini #collapse{align-self:center;margin-inline:0}
#app.mini #collapse svg{transform:rotate(180deg)}

/* ---------------- content ---------------- */
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:40;background:rgba(10,9,8,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;width:100%;padding:14px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#burger{display:none;width:40px;height:40px;border-radius:10px;place-items:center;color:var(--muted)}
#burger:hover{background:var(--panel-2);color:var(--text)}
#burger svg{width:21px;height:21px;stroke-width:2}
.sec-title{font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap}
.bar-tools{display:flex;align-items:center;gap:9px;flex:1;justify-content:flex-end;min-width:0}
.search{position:relative;flex:0 1 300px;min-width:150px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim);pointer-events:none}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:9px 34px;font-size:14px}
.search input:focus{outline:none;border-color:var(--line-copper)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:none;place-items:center;color:var(--dim)}
.search .clear.show{display:grid}
.mini-t{flex:none;font-size:12.5px;font-weight:500;color:var(--muted);padding:8px 13px;border-radius:99px;border:1px solid var(--line);transition:all .16s;white-space:nowrap}
.mini-t:hover{color:var(--soft)}
.mini-t.on{color:var(--copper-lite);border-color:var(--line-copper);background:rgba(245,130,43,.07)}

main{flex:1;max-width:820px;margin:0 auto;padding:16px 22px 60px;width:100%}
.day{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:26px 0 12px;display:flex;align-items:center;gap:14px}
.day:first-child{margin-top:6px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:flex;flex-direction:column;gap:11px}

.card{position:relative;display:flex;align-items:stretch;gap:0;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  transition:border-color .18s,background .18s;animation:cardIn .45s cubic-bezier(.16,.84,.44,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.card:hover{background:var(--panel-2);border-color:var(--line-copper)}
.card.flash::after{content:"";position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
  box-shadow:inset 0 0 0 1px var(--copper),0 0 26px rgba(245,130,43,.25);animation:flashOut 1.6s ease-out forwards}
@keyframes flashOut{to{opacity:0}}
.card .rail{flex:0 0 4px;background:transparent}
.card.unread .rail{background:linear-gradient(180deg,var(--copper-lite),var(--copper-deep))}
.card.urgent{border-color:rgba(255,77,66,.32);background:linear-gradient(180deg,var(--urgent-soft),var(--panel) 60%)}
.card.urgent .rail{background:linear-gradient(180deg,#ff7b73,var(--urgent))}
.card.done .hero,.card.done .who,.card.done .line{color:var(--dim)}
.card.done{opacity:.72}

.card .main{flex:1;min-width:0;padding:16px 4px 16px 16px;cursor:pointer}
.card .top{display:flex;align-items:baseline;gap:10px}
.card .who{font-weight:600;font-size:16.5px;color:var(--text);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .when{flex:none;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto}
.card .hero{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.01em;margin-top:5px;color:var(--copper-lite);line-height:1.3;overflow-wrap:anywhere}
.card.urgent .hero{color:#ff9089}
.card .line{font-size:14.5px;color:var(--soft);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tag{display:inline-block;margin-top:9px;font-size:12px;font-weight:600;color:var(--muted)}
.card .tag.urg{color:#ff9089}
.card .tag.new{color:var(--copper-lite)}

.doneBtn{flex:none;align-self:center;width:46px;height:46px;margin:0 14px;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--line);color:var(--dim);transition:all .16s}
.doneBtn:hover{border-color:var(--ok);color:var(--ok)}
.doneBtn.on{background:rgba(99,207,158,.12);border-color:var(--ok);color:var(--ok)}
.doneBtn svg{width:20px;height:20px;stroke-width:2.4}

/* states */
.state{text-align:center;padding:78px 20px}
.state .ico{width:46px;height:46px;margin:0 auto 16px;color:#3d352e}
.state h3{font-family:var(--display);font-weight:700;font-size:18px;margin-bottom:8px}
.state p{color:var(--muted);font-size:14.5px;max-width:340px;margin:0 auto;line-height:1.55}
.state button{margin-top:18px;padding:10px 20px;border-radius:99px;border:1px solid var(--line-copper);color:var(--copper-lite);font-family:var(--display);font-weight:600;font-size:13.5px}
.skeleton{display:flex;flex-direction:column;gap:11px;padding-top:6px}
.sk{height:110px;border-radius:var(--r);background:linear-gradient(100deg,var(--panel) 30%,var(--panel-3) 50%,var(--panel) 70%);background-size:220% 100%;animation:shimmer 1.5s linear infinite}
@keyframes shimmer{to{background-position:-220% 0}}
.loadmore{display:block;margin:24px auto 0;padding:11px 24px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-family:var(--display);font-weight:600;font-size:13.5px}
.loadmore:hover{border-color:var(--line-copper);color:var(--copper-lite)}

/* nudge */
#nudge{max-width:820px;margin:0 auto;width:100%;padding:12px 22px 0;display:none}
#nudge.show{display:block}
.nudge-in{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line-copper);border-radius:14px;padding:13px 15px}
.nudge-in p{flex:1;font-size:14px;color:var(--muted)}
.nudge-in button{font-family:var(--display);font-weight:600;font-size:13px;padding:8px 15px;border-radius:99px;white-space:nowrap}
.nudge-in .yes{color:#180d04;background:linear-gradient(180deg,var(--copper-lite),var(--copper))}
.nudge-in .no{color:var(--dim)}

/* ---------------- drawer ---------------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:.28s;z-index:60}
#scrim.show{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);
  z-index:70;transform:translateX(100%);transition:transform .32s cubic-bezier(.22,.9,.3,1);display:flex;flex-direction:column}
#drawer.show{transform:none}
.dr-head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.dr-top{display:flex;align-items:flex-start;gap:12px}
.dr-top h2{font-family:var(--display);font-weight:700;font-size:23px;flex:1;min-width:0;word-break:break-word}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .16s,color .16s}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn svg{width:19px;height:19px;stroke-width:1.9}
.dr-hero{font-family:var(--display);font-weight:700;font-size:17px;color:var(--copper-lite);margin-top:6px}
.dr-meta{margin-top:8px;font-size:13px;color:var(--muted)}
.dr-body{flex:1;overflow-y:auto;padding:20px 22px 28px}
.sect+.sect{margin-top:24px}
.sect h4{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.big-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bf{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.bf dt{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.bf dd{font-family:var(--display);font-weight:700;font-size:17px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:14.5px}
.kv dt{color:var(--muted);font-size:13px;padding-top:1px}
.kv dd{overflow-wrap:anywhere}
.prose{font-size:15px;line-height:1.65;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.transcript{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:15px;font-size:13.5px;line-height:1.65;color:var(--muted);white-space:pre-wrap;max-height:320px;overflow-y:auto;overflow-wrap:anywhere}
audio{width:100%;margin-top:4px;filter:invert(.88) hue-rotate(180deg) saturate(.7)}
.rec-link{display:inline-flex;gap:7px;font-size:14px;color:var(--copper-lite);text-decoration:underline;text-underline-offset:3px}
.dr-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;background:var(--panel-2)}
.act{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);color:var(--text);font-family:var(--display);font-weight:600;font-size:13.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .16s;white-space:nowrap;text-decoration:none}
.act:hover{background:var(--panel-3);border-color:var(--line-copper)}
.act svg{width:16px;height:16px;stroke-width:2}
.act.green{color:var(--ok);border-color:rgba(99,207,158,.35);background:rgba(99,207,158,.07)}
.act.call{color:#180d04;background:linear-gradient(180deg,var(--copper-lite),var(--copper));border-color:transparent}
.act.call:hover{filter:brightness(1.08)}

#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel-3);border:1px solid var(--line-copper);border-radius:99px;padding:10px 18px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:toastIn .3s cubic-bezier(.16,.84,.44,1) both}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------------- reviews ---------------- */
.rv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 18px}
.rv-headline{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.2}
.rv-headline em{font-style:normal;color:var(--copper-lite)}
.rv-sub{color:var(--muted);font-size:14px;margin-top:4px}
.rv-toggle{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:99px;border:1px solid var(--line);
  color:var(--soft);font-family:var(--display);font-weight:600;font-size:13px;transition:all .16s;white-space:nowrap}
.rv-toggle:hover{border-color:var(--line-copper)}
.rv-toggle .dot{width:8px;height:8px}
.rv-toggle.off{border-color:rgba(255,77,66,.4);color:#ff9089;background:var(--urgent-soft)}
.rv-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:20px}
.rv-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.rv-stat-n{font-family:var(--display);font-weight:700;font-size:23px}
.rv-stat-l{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.rv-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rv-tabs{display:flex;gap:8px}
.rv-tab{padding:8px 15px;border-radius:99px;border:1px solid var(--line);color:var(--muted);
  font-family:var(--display);font-weight:600;font-size:13px;transition:all .16s;white-space:nowrap}
.rv-tab:hover{color:var(--soft)}
.rv-tab.on{color:var(--copper-lite);border-color:var(--line-copper);background:rgba(245,130,43,.08)}
.rv-tab .n{margin-left:6px;font-size:11.5px;color:var(--dim)}
.rv-tab.on .n{color:var(--copper)}
.rv-locs{display:flex;gap:6px;flex-wrap:wrap}
.rv-chip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-size:12px;transition:all .16s}
.rv-chip:hover{border-color:var(--line-copper)}
.rv-chip.on{color:var(--copper-lite);border-color:var(--line-copper);background:rgba(245,130,43,.08)}
.rv-queue{display:flex;flex-direction:column;gap:11px}
.rv-item{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 18px 21px;overflow:hidden}
.rv-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.rv-item.held::before{background:linear-gradient(180deg,var(--copper-lite),var(--copper-deep))}
.rv-item.done{opacity:.82}
.rv-item.done::before{background:rgba(99,207,158,.45)}
.rv-ihead{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.rv-stars{font-size:14px;letter-spacing:2px;color:var(--copper-lite)}
.rv-stars.low{color:#ff9089}
.rv-who{font-weight:600;font-size:15.5px}
.rv-meta{font-size:12px;color:var(--dim)}
.rv-text{margin-top:10px;color:var(--soft);font-size:14.5px;line-height:1.6}
.rv-nomsg{margin-top:10px;color:var(--dim);font-style:italic;font-size:14px}
.rv-draft{margin-top:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;transition:border-color .16s}
.rv-draft:focus-within{border-color:var(--copper)}
.rv-draft-tag{font-family:var(--display);font-weight:700;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--copper-lite);padding:11px 14px 0}
.rv-draft textarea{width:100%;border:0;background:transparent;resize:vertical;min-height:80px;padding:7px 14px 13px;
  font:inherit;font-size:14.5px;color:var(--text);line-height:1.6}
.rv-draft textarea:focus{outline:none}
.rv-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.rv-btn{padding:10px 17px;border-radius:11px;font-family:var(--display);font-weight:600;font-size:13px;
  color:#180d04;background:linear-gradient(180deg,var(--copper-lite),var(--copper));border:1px solid transparent;transition:filter .16s}
.rv-btn:hover:not([disabled]){filter:brightness(1.08)}
.rv-btn[disabled]{opacity:.45;cursor:default}
.rv-btn.ghost{background:none;color:var(--soft);border-color:var(--line)}
.rv-btn.ghost:hover{color:var(--copper-lite);border-color:var(--line-copper);filter:none}
.rv-status{font-size:12.5px;color:var(--dim);margin-top:12px}
.rv-status.good{color:var(--ok)}
.rv-status.bad{color:#ff9089}
.rv-ro{margin-top:12px;padding-left:13px;border-left:2px solid var(--line);color:var(--soft);font-size:14px;line-height:1.6;white-space:pre-wrap}
.rv-rules{margin-top:26px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rv-rules summary{padding:14px 17px;cursor:pointer;font-family:var(--display);font-weight:700;font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--copper-lite);list-style:none}
.rv-rules summary::-webkit-details-marker{display:none}
.rv-rules-body{padding:0 17px 15px}
.rv-rule{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--soft)}
.rv-rule-k{font-family:var(--display);font-weight:700;font-size:12px;color:var(--copper-lite);width:100px;flex:none;padding-top:1px}
.rv-note{margin-top:13px;font-size:12.5px;color:var(--dim)}
@media(max-width:640px){.rv-stats{grid-template-columns:1fr 1fr}.rv-headline{font-size:20px}}

/* change password modal */
#pwScrim{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);display:none;place-items:center;padding:22px;z-index:120}
#pwScrim.show{display:grid}
.pw-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line-copper);border-radius:16px;padding:22px;box-shadow:0 22px 70px rgba(0,0,0,.6)}
.pw-card h3{font-family:var(--display);font-weight:700;font-size:18px;margin-bottom:4px}
.pw-card .pw-sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.pw-card .field input{background:var(--panel-2)}
.pw-row{display:flex;gap:9px;margin-top:4px}
.pw-row .btn-primary{flex:1}
.pw-cancel{flex:0 0 auto;padding:0 18px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-family:var(--display);font-weight:600;font-size:13.5px}
.pw-cancel:hover{color:var(--text);border-color:var(--line-copper)}
.pw-msg{margin-top:12px;font-size:13px;display:none;line-height:1.5}
.pw-msg.show{display:block}
.pw-msg.err{color:#ff9089}
.pw-msg.ok{color:var(--ok)}

/* sidebar scrim (mobile) */
#sideScrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:.25s;z-index:75}
#sideScrim.show{opacity:1;visibility:visible}

@media(max-width:900px){
  #side{position:fixed;left:0;top:0;bottom:0;height:auto;transform:translateX(-100%);transition:transform .28s cubic-bezier(.22,.9,.3,1);
    flex-basis:var(--side)!important;width:var(--side)!important;box-shadow:14px 0 44px rgba(0,0,0,.55)}
  #side.open{transform:none}
  #app.mini .side-biz,#app.mini .item .lbl,#app.mini .f-item .lbl{display:block}
  #app.mini .side-top{justify-content:flex-start;padding-inline:16px}
  #app.mini .item,#app.mini .f-item{justify-content:flex-start;padding-inline:12px}
  #app.mini .item .n{position:static;min-width:21px;padding:1px 7px;font-size:11.5px}
  #collapse{display:none}
  #burger{display:grid}
  .bar-in{padding:12px 16px}
  main{padding:14px 16px 60px}
  #nudge{padding:12px 16px 0}
  .sec-title{font-size:17.5px}
  .search{flex:1 1 100%;order:5}
  .card .hero{font-size:17.5px}
  .doneBtn{width:42px;height:42px;margin:0 11px}
  #drawer{width:100%;top:auto;height:92vh;border-left:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(100%)}
  #drawer.show{transform:none}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dt{margin-top:9px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

<body>

<div id="boot"><img src="JollyPhone_Logo.png" alt="Jolly Phone" /></div>

<div id="auth">
  <div class="auth-card">
    <img src="JollyPhone_Logo.png" alt="" aria-hidden="true" />
    <div class="auth-brand">JOLLYPHONE</div>
    <p class="auth-sub">Sign in to see your calls</p>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" inputmode="email" spellcheck="false" /></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" /></div>
    <button class="btn-primary" id="signInBtn">Sign in</button>
    <button class="auth-alt" id="magicBtn">Can't get in? Email me a sign-in link</button>

      <div class="side-biz">
        <h1 id="bizName">—</h1>
        <div class="sub"><span class="dot wait" id="connDot"></span><span id="connText">Connecting</span></div>
      </div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot">
      <button class="f-item on" id="soundBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <span class="lbl">Sound on</span>
      </button>
      <button class="f-item" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        <span class="lbl">Export CSV</span>
      </button>
      <button class="f-item" id="pwBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span class="lbl">Change password</span>
      </button>
      <button class="f-item" id="signOutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>

  <div class="content">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>

        <div class="bar-tools">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="q" type="search" placeholder="Search" autocomplete="off" />
            <button class="clear" id="qClear" aria-label="Clear search">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <button class="mini-t" id="fUnread">New only</button>
          <button class="mini-t" id="fArch">Archived</button>
        </div>
      </div>

    <div id="nudge">
      <div class="nudge-in">
        <p>Get a ping when a call comes in — even with this tab in the background.</p>
        <button class="yes" id="nudgeYes">Turn on</button>
        <button class="no" id="nudgeNo">Not now</button>

    <main id="main"></main>

</div>

<div id="sideScrim"></div>
<div id="scrim"></div>

<div id="pwScrim">
  <div class="pw-card" role="dialog" aria-modal="true" aria-label="Change password">
    <h3>Change password</h3>

</div>

<div id="toasts" aria-live="polite"></div>

<script type="module">
const SUPABASE_URL      = 'https://xabotyhmnfaflccruhld.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DTwz3Nryy0zspMGtOT0v6w_U6pbd-PE';
const PAGE = 100;

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const store = {
  get(k){ try{ return localStorage.getItem(k);}catch{ return null;} },
  set(k,v){ try{ localStorage.setItem(k,v);}catch{} }
};
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
});

const $ = id => document.getElementById(id);
const boot=$('boot'), authEl=$('auth'), appEl=$('app'), mainEl=$('main'), drawer=$('drawer'), scrim=$('scrim');
const sideEl=$('side'), sideScrim=$('sideScrim');

const S = {
  user:null, clientId:null, client:null, tz:'America/Los_Angeles',
  calls:[], byId:new Map(),
  tab:'all', navItems:[], unreadOnly:false, archived:false, query:'',
  reachedEnd:false, loading:false,
  soundOn: store.get('jp_sound') !== 'off',
  openId:null, channel:null, connected:false, everConnected:false
};

/* ---------------- utils ---------------- */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function f(call, ...keys){
  for(const k of keys){ const v=call[k]; if(v!==null&&v!==undefined&&String(v).trim()!=='') return v; }
  const raw = call.raw||{};
  for(const k of keys){ const v=raw[k]; if(v!==null&&v!==undefined&&String(v).trim()!=='') return v; }
  return null;
}
function typeOf(c){
  const t = (c.call_type || (c.raw&&c.raw.call_type) || '').toString().toLowerCase().trim();
  if(t.includes('reserv')) return 'reservation';
  if(t.includes('order')) return 'order';
  return 'general';
}
function fmtPhone(v){
  if(!v) return null;
  const d=String(v).replace(/\D/g,'');
  if(d.length===11&&d[0]==='1') return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  if(d.length===10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  return String(v);
}
function tzKey(iso){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:S.tz,year:'numeric',month:'2-digit',day:'2-digit'})
    .formatToParts(new Date(iso)).map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const timeOf = iso => new Intl.DateTimeFormat('en-US',{timeZone:S.tz,hour:'numeric',minute:'2-digit'}).format(new Date(iso));
function relOf(iso){
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<45) return 'Just now';
  if(s<90) return '1 min ago';
  const m=Math.round(s/60); if(m<60) return m+' min ago';
  const h=Math.round(m/60); if(h<24) return h+(h===1?' hr ago':' hrs ago');
  return timeOf(iso);
}
function dayLabel(iso){
  const k=tzKey(iso), today=tzKey(new Date().toISOString()), yest=tzKey(new Date(Date.now()-864e5).toISOString());
  if(k===today) return 'Today';
  if(k===yest) return 'Yesterday';
  const d=new Date(iso);
  const recent=(Date.now()-d.getTime())<6*864e5;
  return new Intl.DateTimeFormat('en-US', recent?{timeZone:S.tz,weekday:'long'}:{timeZone:S.tz,month:'long',day:'numeric'}).format(d);
}
const whenOf = iso => (Date.now()-new Date(iso).getTime())<6*36e5 ? relOf(iso) : timeOf(iso);

function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  $('toasts').appendChild(el); setTimeout(()=>el.remove(),2600);
}

let actx=null;
function chime(urgent){
  if(!S.soundOn) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const now=actx.currentTime, notes=urgent?[880,1174,880,1174]:[659,880];
    notes.forEach((hz,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=hz;
      const t=now+i*(urgent?.15:.13);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(urgent?.22:.14,t+.015);
      g.gain.exponentialRampToValueAtTime(.0008,t+.34);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.4);
    });
  }catch{}
}
function desktopNotify(call){
  if(!('Notification' in window)||Notification.permission!=='granted'||!document.hidden) return;
  const who=f(call,'caller_name')||'Unknown caller';
  const type=typeOf(call);
  const what = type==='reservation' ? heroRes(call) : type==='order' ? heroOrd(call) : (f(call,'reason','summary')||'New call');
  try{
    const n=new Notification(
      call.is_urgent?`URGENT — ${who}`:(type==='reservation'?`New reservation — ${who}`:type==='order'?`New order — ${who}`:`New call — ${who}`),
      { body:String(what).slice(0,140), tag:call.id });
    n.onclick=()=>{ window.focus(); openDrawer(call.id); n.close(); };
  }catch{}
}

/* ---------------- auth ---------------- */
function authMsg(t,k){ const e=$('authMsg'); e.textContent=t; e.className='auth-msg show '+(k||'err'); }
async function signIn(){
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||!password){ authMsg('Enter your email and password.'); return; }
  const b=$('signInBtn'); b.disabled=true; b.textContent='Signing in…'; $('authMsg').className='auth-msg';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  b.disabled=false; b.textContent='Sign in';
  if(error) authMsg(/invalid/i.test(error.message)?'That email and password don\'t match. Try again, or use the sign-in link below.':error.message);
}
async function magicLink(){
  const email=$('email').value.trim();
  if(!email){ authMsg('Enter your email first, then tap this again.'); return; }
  $('authMsg').className='auth-msg';
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo:window.location.href, shouldCreateUser:false } });
  if(error) authMsg(error.message);
  else authMsg('Check your email — the sign-in link is on its way.','ok');
}
$('signInBtn').addEventListener('click',signIn);
$('magicBtn').addEventListener('click',magicLink);
$('password').addEventListener('keydown',e=>{ if(e.key==='Enter') signIn(); });
$('email').addEventListener('keydown',e=>{ if(e.key==='Enter') $('password').focus(); });
$('signOutBtn').addEventListener('click',async()=>{
  if(!confirm('Sign out of this dashboard?')) return;
  try{ if(S.channel) sb.removeChannel(S.channel);}catch{}
  await sb.auth.signOut(); location.reload();
});
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='SIGNED_IN'&&session&&!S.user) start(session);
  if(ev==='SIGNED_OUT') location.reload();
});

(async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) start(session);
  else { boot.style.display='none'; authEl.classList.add('show'); $('email').focus(); }
})();

async function start(session){
  S.user=session.user;
  boot.style.display='none'; authEl.classList.remove('show'); appEl.classList.add('show');
  if(store.get('jp_side')==='mini') appEl.classList.add('mini');

  const { data:prof, error:pErr } = await sb.from('profiles').select('client_id').eq('id',S.user.id).single();
  if(pErr||!prof){
    mainEl.innerHTML=stateHTML('key','This login isn\'t linked to a business','It signed in fine but isn\'t connected to a business yet. Contact Jolly Phone to finish setup.');
    return;
  }
  S.clientId=prof.client_id;

  const { data:client } = await sb.from('clients').select('id,name,business_type,timezone,features').eq('id',S.clientId).single();
  if(client){
    S.client=client; S.tz=client.timezone||S.tz;
    $('bizName').textContent=client.name;
    document.title=`Your Calls — ${client.name}`;
  }
  buildNav();
  syncSound();
  await loadCalls(true);
  subscribe();
  maybeNudge();
  setInterval(tickTimes,30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
  window.addEventListener('online',()=>{ setConn('wait','Reconnecting'); resub(); });
  window.addEventListener('offline',()=>setConn('off','Offline'));
}

/* ---------------- sidebar nav ---------------- */
const NAV_ICONS={
  all:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
  order:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  reservation:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  reviews:'<path d="M12 2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.5-5.9-3.3-5.9 3.3 1.3-6.5L2.5 8.9l6.6-.8z"/>'
};
const SEC_TITLES={all:'All calls',order:'Orders',reservation:'Reservations',reviews:'Reviews'};

function buildNav(){
  const feats=(S.client&&S.client.features)||{};
  S.navItems=[{id:'all',label:'All calls'}];
  if(feats.orders)       S.navItems.push({id:'order',label:'Orders'});
  if(feats.reservations) S.navItems.push({id:'reservation',label:'Reservations'});
  if(feats.reviews)      S.navItems.push({id:'reviews',label:'Reviews'});
  S.tab='all';
  const nav=$('nav');
  nav.innerHTML=S.navItems.map(t=>`<button class="item${t.id===S.tab?' active':''}" data-t="${t.id}" title="${t.label}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS[t.id]}</svg>
      <span class="lbl">${t.label}</span><span class="n" data-n="${t.id}"></span>
    </button>`).join('');
  nav.addEventListener('click',e=>{
    const b=e.target.closest('.item'); if(!b) return;
    S.tab=b.dataset.t;
    nav.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',x===b));
    $('secTitle').textContent=SEC_TITLES[S.tab]||'All calls';
    document.querySelector('.bar-tools').style.display = S.tab==='reviews' ? 'none' : '';
    closeSide();
    if(S.tab==='reviews') renderReviews(); else render();
  });
}

/* collapse + mobile open */
$('collapse').addEventListener('click',()=>{
  appEl.classList.toggle('mini');
  store.set('jp_side', appEl.classList.contains('mini')?'mini':'full');
});
function openSide(){ sideEl.classList.add('open'); sideScrim.classList.add('show'); }
function closeSide(){ sideEl.classList.remove('open'); sideScrim.classList.remove('show'); }
$('burger').addEventListener('click',openSide);
sideScrim.addEventListener('click',closeSide);

/* ---------------- data ---------------- */
async function loadCalls(reset){
  if(S.loading) return;
  S.loading=true;
  if(reset){ S.calls=[]; S.byId.clear(); S.reachedEnd=false;
    mainEl.innerHTML='<div class="skeleton">'+'<div class="sk"></div>'.repeat(4)+'</div>'; }
  const from=S.calls.length;
  const { data, error } = await sb.from('calls').select('*').eq('client_id',S.clientId)
    .order('created_at',{ascending:false}).range(from,from+PAGE-1);
  S.loading=false;
  if(error){
    mainEl.innerHTML=stateHTML('warn','Couldn\'t load your calls','Something went wrong reaching the server. Check your connection and try again.','Try again');
    const b=mainEl.querySelector('button'); if(b) b.onclick=()=>loadCalls(true);
    return;
  }
  if(!data||data.length<PAGE) S.reachedEnd=true;
  (data||[]).forEach(c=>{ if(!S.byId.has(c.id)){ S.byId.set(c.id,c); S.calls.push(c); } });
  render();
}
async function refresh(){
  if(!S.clientId) return;
  const { data } = await sb.from('calls').select('*').eq('client_id',S.clientId)
    .order('created_at',{ascending:false}).limit(PAGE);
  if(!data) return;
  let added=0;
  for(const c of data){
    if(S.byId.has(c.id)) Object.assign(S.byId.get(c.id),c);
    else { S.byId.set(c.id,c); S.calls.push(c); added++; }
  }
  if(added) S.calls.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  render();
}
function subscribe(){
  S.channel=sb.channel('calls:'+S.clientId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'calls',filter:`client_id=eq.${S.clientId}`},p=>incoming(p.new))
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'calls',filter:`client_id=eq.${S.clientId}`},p=>{
      const c=S.byId.get(p.new.id); if(c){ Object.assign(c,p.new); render(); } })
    .subscribe(st=>{
      if(st==='SUBSCRIBED'){ setConn('live','Live'); S.connected=true; if(S.everConnected) refresh(); S.everConnected=true; }
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ S.connected=false; setConn('wait','Reconnecting'); }
      else if(st==='CLOSED'){ S.connected=false; setConn('off','Offline'); }
    });
}
function resub(){ try{ if(S.channel) sb.removeChannel(S.channel);}catch{} subscribe(); }
function incoming(row){
  if(S.byId.has(row.id)) return;
  S.byId.set(row.id,row); S.calls.unshift(row);
  render(row.id); chime(row.is_urgent); desktopNotify(row);
}
function setConn(kind,text){ $('connDot').className='dot '+kind; $('connText').textContent=text; }
setInterval(()=>{ if(S.clientId&&!S.connected) refresh(); },60000);

/* ---------------- mutations ---------------- */
async function patch(id,fields,label){
  const call=S.byId.get(id); if(!call) return;
  const before={...call};
  Object.assign(call,fields); render();
  if(S.openId===id) renderDrawer(call);
  const { error } = await sb.from('calls').update(fields).eq('id',id);
  if(error){
    Object.assign(call,before); render();
    if(S.openId===id) renderDrawer(call);
    toast('Couldn\'t save that — try again');
  } else if(label) toast(label);
}
const markRead=id=>patch(id,{read_at:new Date().toISOString()});
const toggleDone=id=>{ const c=S.byId.get(id);
  patch(id,{handled_at:c.handled_at?null:new Date().toISOString()}, c.handled_at?'Marked not done':'Done'); };
const toggleArch=id=>{ const c=S.byId.get(id);
  patch(id,{archived_at:c.archived_at?null:new Date().toISOString()}, c.archived_at?'Restored':'Archived'); };

/* ---------------- filtering ---------------- */
function visible(){
  const q=S.query.trim().toLowerCase();
  return S.calls.filter(c=>{
    if(S.archived){ if(!c.archived_at) return false; }
    else if(c.archived_at) return false;
    if(S.tab!=='all' && typeOf(c)!==S.tab) return false;
    if(S.unreadOnly && c.read_at) return false;
    if(q){
      const hay=[f(c,'caller_name'),f(c,'callback_number'),f(c,'reason'),f(c,'summary'),f(c,'details'),
        f(c,'order_items','items'),f(c,'reservation_datetime','reservation_time')].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ---------------- hero lines ---------------- */
function heroRes(c){
  const party=f(c,'party_size','party');
  const when=f(c,'reservation_datetime','reservation_time','reservation_date','date_time');
  const bits=[];
  if(party) bits.push(/^\d+$/.test(String(party).trim())?`Party of ${String(party).trim()}`:String(party));
  if(when) bits.push(String(when));
  return bits.join('  ·  ')||'Reservation';
}
function heroOrd(c){
  const t=f(c,'pickup_time','pickup');
  return t?`Pickup ${t}`:'Pickup order';
}

/* ---------------- render ---------------- */
function stateHTML(icon,title,body,btn){

    key:'<path d="M21 2l-2 2m-7.6 7.6a5 5 0 1 0-7 7 5 5 0 0 0 7-7zm0 0L15 8m0 0 3 3 3-3-3-3"/>',

function cardHTML(c){
  const type=typeOf(c);
  const who=f(c,'caller_name')||'Unknown caller';
  const cls=['card'];
  if(!c.read_at) cls.push('unread');
  if(c.is_urgent) cls.push('urgent');
  if(c.handled_at) cls.push('done');

  let hero='', line='';
  if(type==='reservation'){
    hero=heroRes(c);
    line=f(c,'special_requests','details','summary','reason')||'';
  } else if(type==='order'){
    hero=heroOrd(c);
    line=f(c,'order_items','items','details','summary')||'';
  } else {
    line=f(c,'reason','summary','matter_summary','details')||'No summary captured';
  }

  let tag='';
  if(c.is_urgent) tag='<span class="tag urg">Urgent — needs you now</span>';
  else if(!c.read_at) tag='<span class="tag new">New</span>';

  return `<div class="${cls.join(' ')}" data-id="${c.id}">
    <span class="rail"></span>
    <div class="main" data-open="${c.id}">
      <div class="top"><span class="who">${esc(who)}</span><span class="when" data-t="${c.created_at}">${esc(whenOf(c.created_at))}</span></div>
      ${hero?`<div class="hero">${esc(hero)}</div>`:''}
      ${line?`<div class="line">${esc(line)}</div>`:''}

    </button>
  </div>`;
}

function render(flashId){
  const counts={reservation:0,order:0,all:0};
  for(const c of S.calls){
    if(c.archived_at||c.read_at) continue;
    counts.all++; const t=typeOf(c); if(t!=='general') counts[t]++;
  }
  counts.reviews = (typeof rvOpenCount==='function') ? rvOpenCount() : 0;
  document.querySelectorAll('[data-n]').forEach(el=>{
    const n=counts[el.dataset.n]||0; el.textContent=n||'';
  });
  document.title=(counts.all?`(${counts.all}) `:'')+`Your Calls — ${S.client?.name||'Jolly Phone'}`;

  if(S.tab==='reviews') return;   // reviews view owns <main>; badges still updated above

  const rows=visible();
  if(!rows.length){
    if(S.query) mainEl.innerHTML=stateHTML('search','No matches',`Nothing here matches “${S.query}”.`);
    else if(S.archived) mainEl.innerHTML=stateHTML('box','Nothing archived','Things you archive get tucked away here.');
    else if(S.tab==='reservation') mainEl.innerHTML=stateHTML('cal','No reservations yet','When someone calls to book, it lands here the moment they hang up.');
    else if(S.tab==='order') mainEl.innerHTML=stateHTML('bag','No orders yet','Pickup orders taken over the phone show up here, ready to make.');
    else mainEl.innerHTML=stateHTML('phone','No calls yet','The moment someone calls your number, their details appear here.');
    return;
  }

  const groups=[]; let cur=null;
  for(const c of rows){
    const label=dayLabel(c.created_at);
    if(!cur||cur.label!==label){ cur={label,items:[]}; groups.push(cur); }
    cur.items.push(c);
  }
  mainEl.innerHTML=groups.map(g=>`<div class="day">${esc(g.label)}</div><div class="cards">${g.items.map(cardHTML).join('')}</div>`).join('')
    +(!S.reachedEnd?'<button class="loadmore" id="more">Show older</button>':'');

  const more=$('more'); if(more) more.onclick=()=>{ more.textContent='Loading…'; loadCalls(false); };
  mainEl.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openDrawer(el.dataset.open)));
  mainEl.querySelectorAll('[data-done]').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); toggleDone(el.dataset.done); }));
  if(flashId){ const el=mainEl.querySelector(`.card[data-id="${flashId}"]`); if(el) el.classList.add('flash'); }
}

/* ---------------- drawer ---------------- */
const SHOWN=new Set(['caller_name','callback_number','reason','details','summary','urgency','call_language','call_type',
  'matter_type','matter_summary','detained','alien_number','hearing_or_deadline_date','existing_client',
  'qualifying_answers','open_questions_for_attorney','final_note','email',
  'party_size','party','reservation_datetime','reservation_time','reservation_date','date_time',
  'order_items','items','pickup_time','pickup','special_requests']);

function row(label,val){
  if(val===null||val===undefined||String(val).trim()==='') return '';
  let v=val; if(typeof v==='boolean') v=v?'Yes':'No';
  return `<dt>${esc(label)}</dt><dd>${esc(String(v))}</dd>`;
}
function bigFact(label,val){
  if(!val) return '';
  return `<div class="bf"><dt>${esc(label)}</dt><dd>${esc(String(val))}</dd></div>`;
}

function renderDrawer(c){

      ${type!=='general'?`<div class="dr-hero">${esc(type==='reservation'?heroRes(c):heroOrd(c))}</div>`:''}

    </div>

      ${items?`<div class="sect"><h4>The order</h4><p class="prose">${esc(typeof items==='object'?JSON.stringify(items,null,2):items)}</p></div>`:''}
      ${summary?`<div class="sect"><h4>${type==='general'?'What they wanted':'From the call'}</h4><p class="prose">${esc(summary)}</p></div>`:''}
      ${facts?`<div class="sect"><h4>Details</h4><dl class="kv">${facts}</dl></div>`:''}
      ${legal?`<div class="sect"><h4>Case information</h4><dl class="kv">${legal}</dl></div>`:''}
      ${qa?`<div class="sect"><h4>Questions asked</h4><p class="prose">${esc(typeof qa==='object'?JSON.stringify(qa,null,2):qa)}</p></div>`:''}
      ${open?`<div class="sect"><h4>Open questions for you</h4><p class="prose">${esc(typeof open==='object'?JSON.stringify(open,null,2):open)}</p></div>`:''}
      ${note?`<div class="sect"><h4>Note</h4><p class="prose">${esc(note)}</p></div>`:''}
      ${extra?`<div class="sect"><h4>Everything else</h4><dl class="kv">${extra}</dl></div>`:''}
      ${rec?`<div class="sect"><h4>Recording</h4>

    </div>
    <div class="dr-foot">
      ${telRaw?`<a class="act call" href="tel:${esc(String(telRaw).replace(/[^\d+]/g,''))}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS.all}</svg>

        ${c.archived_at?'Restore':'Archive'}</button>
    </div>`;

  $('drClose').onclick=closeDrawer;

    { id: 'r_8839', loc: 'on', stars: 2, who: 'Trent M.', ago: '1 hr ago',
      text: 'Quoted me 45 minutes for a battery swap and I sat there for over two hours. Nobody said anything until I asked. The repair itself is fine but that wait was ridiculous.',
      state: 'held',
      draft: "Trent, two hours against a 45-minute quote is our mistake, and not saying anything while you waited made it worse. I'd like to make it right — we'll refund the labor on that swap. Can you call the Ontario store and ask for Dev? I'll take care of it directly.\n— Dev, Ontario Mills" },
    { id: 'r_8836', loc: 'fo', stars: 1, who: 'K. Njoku', ago: '2 hrs ago',
      text: 'Told me the water damage repair would be $120. Got charged $185 at pickup with no explanation. Will not be back.',

    { id: 'r_8834', loc: 'rc', stars: 3, who: 'Priya S.', ago: '4 hrs ago',
      text: 'Repair was solid but the store was pretty chaotic on a Saturday. One person working the counter and a line out the door.',
      state: 'held',
      draft: "Priya, glad the repair held up — the Saturday counter is a fair hit. We're adding a second person on weekends this month, so it should be a shorter wait next time you're in.\n— Marisol, Rancho Cucamonga" },
    { id: 'r_8830', loc: 'on', stars: 5, who: 'Marcus D.', ago: '5 hrs ago',
      text: "Fixed a charging port two other places told me wasn't worth repairing. Saved me buying a new phone.",
      state: 'published', at: '9:41 AM',
      draft: "Marcus, charging ports are worth a look more often than people are told — glad we caught this one. Thanks for giving us the shot.\n— Dev, Ontario Mills" },
    { id: 'r_8829', loc: 'fo', stars: 5, who: 'Denise W.', ago: '6 hrs ago',
      text: '',
      state: 'published', at: '8:15 AM',
      draft: "Thanks for the five stars, Denise — we appreciate it.\n— The Fontana team" },
    { id: 'r_8827', loc: 'rc', stars: 4, who: 'Sam Ortega', ago: '7 hrs ago',
      text: 'Good work on the screen. Only note is the store hours online said 8pm and they close at 7.',
      state: 'flagged', at: '7:52 AM',
      draft: "Sam, thanks for the heads up on the hours — that listing was out of date and we've corrected it. Glad the screen came out well.\n— Marisol, Rancho Cucamonga" },
    { id: 'r_8822', loc: 'on', stars: 5, who: 'Ib K.', ago: 'Yesterday',
      text: 'In and out in twenty minutes.',
      state: 'rejected',

      draft: "Twenty minutes is what we aim for. Come see us at jollyphone.com/ontario for 10% off your next repair!\n— Dev, Ontario Mills" }

};
const RV_REGENS = [
  d => d.split('\n')[0].split('. ').slice(0, 2).join('. ') + '.\n' + d.split('\n').pop(),
  d => d
];
const rvNeeds = r => r.state === 'held' || r.state === 'held_demo' || r.state === 'rejected';
const rvDone  = r => r.state === 'published' || r.state === 'flagged';
function rvOpenCount(){ return RV.reviews.filter(rvNeeds).length; }
const rvStars = n => '★'.repeat(n) + '☆'.repeat(5 - n);

function rvVisible(){
  return RV.reviews.filter(r => {
    if (RV.loc !== 'all' && r.loc !== RV.loc) return false;
    if (RV.tab === 'needs') return rvNeeds(r);
    if (RV.tab === 'sent') return rvDone(r);
    return true;
  });
}

// --- stubbed publish. Swap this one function for the real Google API call. ---
function publishToGoogle(review){
  return new Promise(resolve => {
    setTimeout(function(){
      const promo = /%|https?:|\.com|discount|coupon/i.test(review.draft);
      resolve(promo
        ? { ok: false, reason: 'Google moderation declined this reply: promotional content. Remove the offer and resend.' }
        : { ok: true, at: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) });
    }, 700);
  });
}

function rvCard(r){
  const loc = RV_LOCATIONS[r.loc];
  const cls = rvNeeds(r) ? 'held' : rvDone(r) ? 'done' : '';
  const head = '<div class="rv-ihead">'
    + '<span class="rv-stars ' + (r.stars <= 3 ? 'low' : '') + '">' + rvStars(r.stars) + '</span>'
    + '<span class="rv-who">' + esc(r.who) + '</span>'
    + '<span class="rv-meta">' + esc(loc.name) + ' · ' + esc(r.ago) + '</span></div>';
  const body = r.text
    ? '<p class="rv-text">' + esc(r.text) + '</p>'
    : '<p class="rv-nomsg">Rating only, no comment.</p>';

  if (rvDone(r)) {
    return '<div class="rv-item done">' + head + body
      + '<div class="rv-ro">' + esc(r.draft) + '</div>'
      + '<div class="rv-status good">' + (r.state === 'flagged'
        ? 'Published ' + esc(r.at) + ' · flagged for a spot-check'
        : 'Published ' + esc(r.at) + ' · automatic') + '</div></div>';
  }
  if (r.state === 'publishing') {
    return '<div class="rv-item ' + cls + '">' + head + body + '<div class="rv-status">Sending to Google…</div></div>';
  }
  return '<div class="rv-item ' + cls + '">' + head + body
    + '<div class="rv-draft"><div class="rv-draft-tag">' + (r.state === 'rejected' ? 'Rejected reply' : 'Draft reply') + '</div>'
    + '<textarea data-rvedit="' + r.id + '" rows="3">' + esc(r.draft) + '</textarea></div>'
    + (r.note ? '<div class="rv-status bad">' + esc(r.note) + '</div>' : '')
    + '<div class="rv-actions">'
    + '<button class="rv-btn" data-rvpub="' + r.id + '">Approve &amp; publish</button>'
    + '<button class="rv-btn ghost" data-rvregen="' + r.id + '">Rewrite</button>'
    + '<button class="rv-btn ghost" data-rvskip="' + r.id + '">Skip</button>'
    + '</div></div>';
}

function renderReviews(){
  const open = rvOpenCount();
  const sent = RV.reviews.filter(rvDone).length;
  const headline = open === 0
    ? "You're all caught up."
    : '<em>' + open + '</em> review' + (open === 1 ? '' : 's') + ' need' + (open === 1 ? 's' : '') + ' you.';
  const sub = open === 0
    ? 'Everything today was handled automatically.'
    : 'Everything else today went out on its own.';

  const tabs = [['needs','Needs you',open],['sent','Handled',sent],['all','All',RV.reviews.length]]
    .map(t => '<button class="rv-tab' + (RV.tab===t[0]?' on':'') + '" data-rvtab="' + t[0] + '">' + t[1]
      + '<span class="n">' + t[2] + '</span></button>').join('');
  const chips = [['all','All locations']].concat(Object.keys(RV_LOCATIONS).map(k => [k, RV_LOCATIONS[k].name]))
    .map(c => '<button class="rv-chip' + (RV.loc===c[0]?' on':'') + '" data-rvloc="' + c[0] + '">' + c[1] + '</button>').join('');

  const list = rvVisible();
  const queue = list.length
    ? list.map(rvCard).join('')
    : '<div class="state"><h3>Nothing waiting.</h3><p>New reviews land here within 15 minutes of being posted.</p></div>';

  const rules = RV_RULES.map(r =>
    '<div class="rv-rule"><div class="rv-rule-k">' + r.k + '</div><div>' + r.v + '</div></div>').join('')
    + '<p class="rv-note">Replies are drafted from the review text, the location\'s voice, and past approved replies. Nothing under 4 stars publishes without a person.</p>';

  mainEl.innerHTML =
    '<div class="rv-wrap">'
    + '<div class="rv-head"><div>'
    +   '<div class="rv-headline">' + headline + '</div>'
    +   '<div class="rv-sub">' + sub + '</div>'
    + '</div>'
    + '<button class="rv-toggle' + (RV.autoOn?'':' off') + '" id="rvKill">'
    +   '<span class="dot ' + (RV.autoOn?'live':'off') + '"></span>Auto-publish: ' + (RV.autoOn?'On':'Paused')
    + '</button></div>'
    + '<div class="rv-stats">'
    +   '<div class="rv-stat"><div class="rv-stat-n">' + (open + sent) + '</div><div class="rv-stat-l">Reviews today</div></div>'
    +   '<div class="rv-stat"><div class="rv-stat-n">' + sent + '</div><div class="rv-stat-l">Handled for you</div></div>'
    +   '<div class="rv-stat"><div class="rv-stat-n">4.4</div><div class="rv-stat-l">Rating, 30 days</div></div>'
    +   '<div class="rv-stat"><div class="rv-stat-n">96%</div><div class="rv-stat-l">Response rate</div></div>'
    + '</div>'
    + '<div class="rv-controls"><div class="rv-tabs">' + tabs + '</div><div class="rv-locs">' + chips + '</div></div>'
    + '<div class="rv-queue">' + queue + '</div>'
    + '<details class="rv-rules"><summary>Routing rules</summary><div class="rv-rules-body">' + rules + '</div></details>'
    + '</div>';

  // keep the sidebar badge in sync
  const badge = document.querySelector('[data-n="reviews"]');
  if (badge) badge.textContent = open || '';
}

// delegated events survive innerHTML swaps
mainEl.addEventListener('click', async e => {
  if (S.tab !== 'reviews') return;
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'rvKill') { RV.autoOn = !RV.autoOn; toast(RV.autoOn ? 'Auto-publish on' : 'Auto-publish paused'); return renderReviews(); }
  if (t.dataset.rvtab) { RV.tab = t.dataset.rvtab; return renderReviews(); }
  if (t.dataset.rvloc) { RV.loc = t.dataset.rvloc; return renderReviews(); }
  const id = t.dataset.rvpub || t.dataset.rvregen || t.dataset.rvskip;
  if (!id) return;
  const r = RV.reviews.find(x => x.id === id); if (!r) return;
  if (t.dataset.rvskip) { RV.reviews = RV.reviews.filter(x => x.id !== r.id); return renderReviews(); }
  if (t.dataset.rvregen) {
    RV.regenIx = (RV.regenIx + 1) % RV_REGENS.length;
    r.draft = RV_REGENS[RV.regenIx](r.draft);
    return renderReviews();
  }
  if (t.dataset.rvpub) {
    r.state = 'publishing'; r.note = null; renderReviews();
    const res = await publishToGoogle(r);
    if (res.ok) { r.state = 'published'; r.at = res.at; toast('Reply published'); }
    else { r.state = 'rejected'; r.note = res.reason; }
    renderReviews();
  }
});
mainEl.addEventListener('input', e => {
  const id = e.target.dataset && e.target.dataset.rvedit;
  if (!id) return;
  const r = RV.reviews.find(x => x.id === id);
  if (r) r.draft = e.target.value;
});

</script>
